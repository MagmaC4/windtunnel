services:
  tachometer:
    build: .
    environment:
      - PYTHONUNBUFFERED=1 # this flag makes it so print statements are output instantly instead of waiting
    env_file:
      - .env
    privileged: true
    restart: unless-stopped
    command: python3 tachometer.py
    profiles: ["windtunnel"]

  pitot-static:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    privileged: true
    restart: unless-stopped
    command: python3 pitot-static.py
    profiles: ["windtunnel-2"]

  thermometer:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    privileged: true
    restart: unless-stopped
    command: python3 thermometer.py
    profiles: ["windtunnel-2"]

  barometer:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: no
    command: python3 barometer.py
    profiles: ["windtunnel"]